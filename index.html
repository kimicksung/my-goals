<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>나의 목표</title>
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#273449;
    --line:#334155; --text:#e2e8f0; --muted:#94a3b8;
    --accent:#6366f1; --accent2:#818cf8; --done:#22c55e;
    --danger:#ef4444; --gold:#fbbf24;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
    background:var(--bg); color:var(--text);
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    min-height:100vh;
  }
  header{
    padding:18px 18px 10px; text-align:center;
    background:linear-gradient(135deg,#4f46e5,#7c3aed);
    border-radius:0 0 22px 22px;
    box-shadow:0 6px 20px rgba(79,70,229,.35);
  }
  header h1{margin:0; font-size:20px; letter-spacing:.5px;}
  header .date{margin-top:4px; font-size:13px; opacity:.85;}

  /* 탭 */
  .tabs{
    display:flex; gap:6px; padding:14px 14px 0;
    position:sticky; top:0; z-index:5;
    background:var(--bg);
  }
  .tab{
    flex:1; text-align:center; padding:11px 4px; font-size:14px; font-weight:600;
    background:var(--card); color:var(--muted);
    border:1px solid var(--line); border-radius:12px; cursor:pointer;
    transition:.15s;
  }
  .tab.active{
    background:var(--accent); color:#fff; border-color:var(--accent);
    box-shadow:0 4px 12px rgba(99,102,241,.4);
  }

  /* 진행률 */
  .progress-wrap{padding:14px 16px 4px;}
  .progress-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px;}
  .progress-top .label{font-size:13px; color:var(--muted);}
  .progress-top .pct{font-size:15px; font-weight:700; color:var(--accent2);}
  .bar{height:10px; background:var(--card2); border-radius:99px; overflow:hidden;}
  .bar>i{
    display:block; height:100%; width:0;
    background:linear-gradient(90deg,#6366f1,#22c55e);
    border-radius:99px; transition:width .4s ease;
  }

  /* 목록 */
  .list{padding:8px 14px 120px;}
  .goal{
    display:flex; align-items:center; gap:12px;
    background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:14px; margin-bottom:10px;
    animation:pop .2s ease;
  }
  @keyframes pop{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  .check{
    width:26px; height:26px; flex:0 0 26px; border-radius:50%;
    border:2px solid var(--muted); cursor:pointer; position:relative;
    transition:.15s;
  }
  .goal.done .check{background:var(--done); border-color:var(--done);}
  .goal.done .check::after{
    content:""; position:absolute; left:8px; top:4px;
    width:5px; height:10px; border:solid #fff; border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }
  .goal .body{flex:1; min-width:0;}
  .goal .txt{font-size:15px; line-height:1.35; word-break:break-word;}
  .goal.done .txt{text-decoration:line-through; color:var(--muted);}
  .goal .meta{font-size:11px; color:var(--muted); margin-top:3px;}
  .goal .del{
    color:var(--muted); background:none; border:none; font-size:20px;
    cursor:pointer; padding:4px 6px;
  }
  .goal .del:active{color:var(--danger);}

  .empty{text-align:center; color:var(--muted); padding:50px 20px; font-size:14px; line-height:1.6;}
  .empty .big{font-size:38px; margin-bottom:10px;}

  /* 입력 바 */
  .composer{
    position:fixed; left:0; right:0; bottom:0;
    padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    background:rgba(15,23,42,.95); backdrop-filter:blur(8px);
    border-top:1px solid var(--line);
    display:flex; gap:9px;
  }
  .composer input{
    flex:1; padding:13px 15px; font-size:15px;
    background:var(--card2); color:var(--text);
    border:1px solid var(--line); border-radius:12px; outline:none;
  }
  .composer input:focus{border-color:var(--accent);}
  .composer button{
    padding:0 20px; font-size:22px; font-weight:700;
    background:var(--accent); color:#fff; border:none; border-radius:12px; cursor:pointer;
  }
  .composer button:active{background:var(--accent2);}

  .celebrate{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:80px; pointer-events:none; opacity:0; z-index:50;
  }
  .celebrate.show{animation:cele 1s ease;}
  @keyframes cele{0%{opacity:0; transform:scale(.3);}30%{opacity:1; transform:scale(1.2);}70%{opacity:1;}100%{opacity:0; transform:scale(1);}}
</style>
</head>
<body>
  <header>
    <h1>🎯 나의 목표</h1>
    <div class="date" id="todayLabel"></div>
  </header>

  <div class="tabs" id="tabs">
    <div class="tab active" data-period="today">오늘</div>
    <div class="tab" data-period="week">이번주</div>
    <div class="tab" data-period="month">이번달</div>
    <div class="tab" data-period="year">올해</div>
  </div>

  <div class="progress-wrap">
    <div class="progress-top">
      <span class="label" id="progLabel">달성률</span>
      <span class="pct" id="progPct">0%</span>
    </div>
    <div class="bar"><i id="progBar"></i></div>
  </div>

  <div class="list" id="list"></div>

  <div class="composer">
    <input id="input" type="text" placeholder="목표를 입력하세요" maxlength="120">
    <button id="addBtn">＋</button>
  </div>

  <div class="celebrate" id="celebrate">🎉</div>

<script>
/* ===== 데이터 저장 (핸드폰 안에 보관) ===== */
const KEY = "myGoals_v1";
let goals = JSON.parse(localStorage.getItem(KEY) || "[]");
let current = "today";
const periodName = {today:"오늘", week:"이번주", month:"이번달", year:"올해"};

function save(){ localStorage.setItem(KEY, JSON.stringify(goals)); }

/* ===== 날짜 표시 ===== */
function fmtToday(){
  const d=new Date();
  const days=["일","월","화","수","목","금","토"];
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
}
document.getElementById("todayLabel").textContent = fmtToday();

/* ===== 그리기 ===== */
function render(){
  const items = goals.filter(g=>g.period===current);
  const list = document.getElementById("list");

  // 진행률
  const total = items.length;
  const done = items.filter(g=>g.done).length;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById("progLabel").textContent = `${periodName[current]} 달성  (${done}/${total})`;
  document.getElementById("progPct").textContent = pct + "%";
  document.getElementById("progBar").style.width = pct + "%";

  // 목록
  if(!items.length){
    list.innerHTML = `<div class="empty"><div class="big">📝</div>
      ${periodName[current]} 목표가 아직 없어요.<br>아래에 입력해서 추가해보세요!</div>`;
    return;
  }
  list.innerHTML = "";
  items.forEach(g=>{
    const el = document.createElement("div");
    el.className = "goal" + (g.done ? " done":"");
    el.innerHTML = `
      <div class="check"></div>
      <div class="body">
        <div class="txt"></div>
        <div class="meta"></div>
      </div>
      <button class="del">🗑</button>`;
    el.querySelector(".txt").textContent = g.text;
    el.querySelector(".meta").textContent = g.done
      ? "✅ 완료 · " + g.doneDate
      : "추가 · " + g.created;
    el.querySelector(".check").onclick = ()=>toggle(g.id);
    el.querySelector(".del").onclick = ()=>removeGoal(g.id);
    list.appendChild(el);
  });
}

function nowStr(){
  const d=new Date();
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function addGoal(){
  const inp = document.getElementById("input");
  const text = inp.value.trim();
  if(!text) return;
  goals.unshift({
    id: Date.now()+"_"+Math.floor(performance.now()),
    text, period:current, done:false,
    created: nowStr(), doneDate:null
  });
  inp.value="";
  save(); render();
}

function toggle(id){
  const g = goals.find(x=>x.id===id);
  if(!g) return;
  g.done = !g.done;
  g.doneDate = g.done ? nowStr() : null;
  save(); render();
  if(g.done) celebrate();
}

function removeGoal(id){
  goals = goals.filter(x=>x.id!==id);
  save(); render();
}

function celebrate(){
  const c=document.getElementById("celebrate");
  c.classList.remove("show"); void c.offsetWidth; c.classList.add("show");
}

/* ===== 이벤트 ===== */
document.getElementById("tabs").addEventListener("click", e=>{
  const t = e.target.closest(".tab");
  if(!t) return;
  current = t.dataset.period;
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active", x===t));
  render();
});
document.getElementById("addBtn").onclick = addGoal;
document.getElementById("input").addEventListener("keydown", e=>{ if(e.key==="Enter") addGoal(); });

render();

/* ===== 오프라인 작동 (서비스워커) ===== */
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("service-worker.js").catch(()=>{});
}
</script>
</body>
</html>
